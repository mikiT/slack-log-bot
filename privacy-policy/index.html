<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slack Log Bot</title>
</head>
<body>
  <main>
    <h1>Slack Log Bot</h1>
    <p>Slack のメッセージ、スレッド返信、添付ファイルを Google Sheets と Google Drive に保存する bot です。</p>
    <h2>保存先</h2>
    <ul>
      <li>public channel: 共通スプレッドシートのチャンネル別タブに保存</li>
      <li>private channel: チャンネルごとの専用 Drive フォルダに保存</li>
      <li>private channel のデータはチャンネルメンバーにのみ共有</li>
    </ul>
    <p><a href="privacy-policy.html">プライバシーポリシー</a></p>
    <p><a href="https://github.com/mikiT/slack-log-bot">ソースコード</a></p>
  </main>
</body>
</html>
