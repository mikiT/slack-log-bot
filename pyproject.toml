[project]
name = "slack-log-bot"
version = "0.1.0"
description = "Save Slack messages and attachments to Google Sheets and Google Drive"
requires-python = ">=3.10"
dependencies = [
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
    "gspread>=6.0.0",
    "google-auth>=2.28.0",
    "google-api-python-client>=2.120.0",
    "google-auth-oauthlib>=1.2.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false
